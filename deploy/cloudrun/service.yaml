# Cloud Run service definition (Knative serving API). NOT DEPLOYED: this is a
# reference config; nothing in this repo has been run on GCP.
#
#   gcloud run services replace deploy/cloudrun/service.yaml --region=us-central1
#
# Replace PROJECT_ID, REGION and the issuer/upstream values in gateway.json.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mcp-policy-gateway
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # One instance keeps the in-memory SCIM directory and the local
        # rollback-state file consistent. See docs/cloud-run.md.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: mcp-policy-gateway@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/mcp/mcp-policy-gateway:latest
          args: ["serve", "-config", "/etc/mcpgw/config/gateway.json"]
          ports:
            - containerPort: 8080
          env:
            # Upstream credentials and the SCIM token come from Secret
            # Manager; they never appear in the image or the config file.
            - name: FILES_TOKEN
              valueFrom:
                secretKeyRef: { name: mcpgw-files-upstream-token, key: latest }
            - name: SCIM_TOKEN
              valueFrom:
                secretKeyRef: { name: mcpgw-scim-token, key: latest }
          volumeMounts:
            - { name: config, mountPath: /etc/mcpgw/config, readOnly: true }
            - { name: policy, mountPath: /etc/mcpgw/policy, readOnly: true }
            - { name: keys, mountPath: /etc/mcpgw/keys, readOnly: true }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: config
          secret:
            secretName: mcpgw-config
            items: [{ key: latest, path: gateway.json }]
        - name: policy
          secret:
            secretName: mcpgw-policy-bundle
            items: [{ key: latest, path: bundle.json }]
        - name: keys
          secret:
            secretName: mcpgw-trusted-keys
            items: [{ key: latest, path: trusted_keys.json }]
