name: ci
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # unit, negative and end-to-end tests (gateway -> fake MCP servers over real HTTP)
      - run: go test -race -count=1 ./...
      - name: Local demo (real processes on loopback)
        run: ./scripts/demo.sh

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { pkg: ./internal/jsonrpc, name: FuzzParseRequest }
          - { pkg: ./internal/policy, name: FuzzDecide }
          - { pkg: ./internal/policy, name: FuzzLoadBundle }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=30s ${{ matrix.target.pkg }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t mcp-policy-gateway:ci .
      - name: Image runs
        run: docker run --rm mcp-policy-gateway:ci version
